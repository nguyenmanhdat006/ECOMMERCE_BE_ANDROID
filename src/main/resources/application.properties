spring.application.name=shopee-be
#server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate properties
# Schema do Flyway quản lý (src/main/resources/db/migration); Hibernate chỉ kiểm tra khớp entity
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# DB đã có sẵn schema (tạo trước khi dùng Flyway) được coi là đã ở V1; DB trống sẽ chạy V1 -> V2...
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


#Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=manhdatvbhp@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#JWT

jwt.auth.app=authapp
jwt.auth.secret_key=${JWT_KEY}
jwt.auth.expires_in=3600

# server.port=8081


# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# File Storage Configuration
file.storage.type=${FILE_STORAGE_TYPE}

# Local File Storage
file.upload-dir=./uploads
file.upload-url=${FILE_UPLOAD_URL:http://localhost:8080/uploads}

# AWS S3 Configuration (Optional - for cloud storage)
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:}

spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=file:uploads/

spring.devtools.restart.enabled=true
spring.devtools.restart.trigger-file=.reloadtrigger

env=${ENV:development}

logging.level.org.springframework.security=DEBUG
logging.level.com.nguyendat.shopee_be.services=DEBUG
spring.main.allow-circular-references=true

frontend.url=${FRONTEND_URL:http://localhost:5173}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://ecommerce-fe-pink-one.vercel.app}
# Seed data mẫu (DataSeeder) - chỉ bật ở môi trường dev/test
app.seed.enabled=${SEED_ENABLED:false}
app.seed.password=${SEED_PASSWORD:}
